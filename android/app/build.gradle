apply plugin: 'com.android.application'

android {
    namespace "global.medicea.app"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "global.medicea.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Candidate 16 follows the newest prepared wrapper bundle (15). Verify against
        // Play before upload; a later candidate can override -PmediceaVersionCode.
        versionCode providers.gradleProperty('mediceaVersionCode').getOrElse('16').toInteger()
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ⬇️ ADD THIS BLOCK ⬇️
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // ⬆️ ADD THIS BLOCK ⬆️

    def signingReady = ['MEDICEA_KEYSTORE_PATH','MEDICEA_KEYSTORE_PASSWORD','MEDICEA_KEY_ALIAS','MEDICEA_KEY_PASSWORD'].every { System.getenv(it) }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(System.getenv('MEDICEA_KEYSTORE_PATH'))
                storePassword System.getenv('MEDICEA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MEDICEA_KEY_ALIAS')
                keyPassword System.getenv('MEDICEA_KEY_PASSWORD')
            }
        }
    }
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !signingReady) {
            throw new GradleException('Release signing environment is not configured')
        }
    }

    buildTypes {
        debug {
            // default debug signing config is fine
        }
        release {
            signingConfig signingConfigs.release
            // For first release, keep minify/shrink off to avoid surprises
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.android.billingclient:billing:9.1.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
